# pins.conf: what build-srpm.sh builds. Change these to move to a new point release (see README.md).
# Sourced by bash: plain NAME="value" lines only.

# linux-surface's patches and Fedora packaging, pinned to a full commit hash: branch 7.2.10-pro9 of
# linux-surface-contrib, which is linux-surface/linux-surface#2233's head (a23fa87: patches/7.2 rebased
# to v7.2.10) plus surface3, Type Cover and Surface Pro 9 fixes and OV5693 front-camera backports
# in patches/7.2. The ref copr/7.2.10-patches (a tag, or a branch where tags can't be pushed) keeps
# the commit fetchable if the branch moves.
CONTRIB_URL="https://github.com/CmdrShepardsPie/linux-surface-contrib"
CONTRIB_COMMIT="b68143680b3666fa1cb5f2b6edca50fd35d80b60"

# Fedora's kernel tree (kernel-ark), and the tag the package is built from: kernel-X.Y.Z-0.
ARK_URL="https://gitlab.com/cki-project/kernel-ark"
PACKAGE_TAG="kernel-7.2.10-0"
# ...and the full commit hash that tag must point to (a moved tag stops the build).
ARK_COMMIT="13d495da1d24ece069efaadc3d45a012ad4a352c"

# The package's release number (bump it to rebuild the same kernel).
PACKAGE_RELEASE="1"

# Fedora packaging patches (pkg/fedora/kernel-surface/patches and secureboot/) from this commit
# instead of CONTRIB's, when CONTRIB's don't fit this kernel's spec. Empty: use CONTRIB's.
# 7.2: linux-surface's (6.19-era) don't apply to kernel-7.2.10-0's spec; these, rebased for 7.2 by
# orthogonaleety (branch f44-7.2.10-0 of orthogonaleety/linux-surface), do. Only the patches are taken:
# not that branch's package name, keys or watchdog script (its 0004 also runs a sed for @BUILDID@ on the
# watchdog, which does nothing to linux-surface's). The ref copr/7.2.10-fedora-pkg in
# linux-surface-contrib keeps the commit fetchable if that branch is deleted.
PKG_PATCHES_URL="https://github.com/CmdrShepardsPie/linux-surface-contrib"
PKG_PATCHES_COMMIT="9f060d24979d329ccb18e0acd92312f5b39fa7f3"
