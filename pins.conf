# pins.conf: what build-srpm.sh builds. Change these to move to a new point release (see README.md).
# Sourced by bash: plain NAME="value" lines only.

# linux-surface's patches and Fedora packaging, pinned to a full commit hash: branch 7.3.1-pro9 of
# linux-surface-contrib. That is linux-surface's master (668a020) with its open pull request #2347
# (8dd1a0b, fc130e2: packaging refreshed for kernel-7.3.1-0), plus, appended to their patch sets, the 20
# Surface Pro 9 patches they don't have and the battery status fix (see those commits' messages). The ref
# copr/7.3.1-patches (a tag, or a branch where tags can't be pushed) keeps the commit fetchable if the
# branch moves.
CONTRIB_URL="https://github.com/CmdrShepardsPie/linux-surface-contrib"
CONTRIB_COMMIT="9366e66674b474bdd29282908666651b9c7be181"

# Fedora's kernel tree (kernel-ark), and the tag the package is built from: kernel-X.Y.Z-0 for a point
# release (see build-srpm.sh, step 5).
ARK_URL="https://gitlab.com/cki-project/kernel-ark"
PACKAGE_TAG="kernel-7.3.1-0"
# ...and the full commit hash that tag must point to (a moved tag stops the build).
ARK_COMMIT="d9fc5897d9182f6906de0f092e1142454303e26a"

# The package's release number (bump it to rebuild the same kernel; back to 1, and drop the note after
# it, for a new point release).
PACKAGE_RELEASE="1"

# This repository's own package name (the package is kernel-PACKAGE_NAME) and release suffix, so its
# kernels never look like, or replace, linux-surface's kernel-surface packages: they install beside them,
# and `uname -r` shows whose build it is (7.2.12-1.cmdrshepardspie.fc43.x86_64). fixups/0003 removes the
# packaging lines that would act on linux-surface's package, and build-srpm.sh refuses any that remain.
PACKAGE_NAME="surface-cmdrshepardspie"
RELEASE_SUFFIX=".cmdrshepardspie"

# Fedora packaging patches (pkg/fedora/kernel-surface/patches and secureboot/) from this commit
# instead of CONTRIB's, when CONTRIB's don't fit this kernel's spec. Empty: use CONTRIB's.
# 7.3.1: CONTRIB's own, linux-surface's refresh for kernel-7.3.1-0's spec (their 8dd1a0b).
PKG_PATCHES_URL=""
PKG_PATCHES_COMMIT=""
