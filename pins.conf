# pins.conf: what build-srpm.sh builds. Change these to move to a new point release (see README.md).
# Sourced by bash: plain NAME="value" lines only.
#
# TEST BRANCH test/7.2.12-pr181, never merged: the exact thing linux-surface users would run with
# linux-surface/kernel PR #181 (rylos, sp5-ipu3-cameras, head 76d2ae0226af8d6b233e90fa35b154cf0be842e3)
# applied: linux-surface's official release fedora-43-7.2.12-1 plus the PR's 10 commits, unchanged
# (fixups/0010 adds them to patches/7.2 after linux-surface's own). Own package name
# (kernel-surface-pr181), so it never touches kernel-surface-cmdrshepardspie, kernel-surface-samtest or
# linux-surface's kernel-surface. `uname -r`: 7.2.12-1.pr181.fc43.x86_64.
# Remove with `dnf remove 'kernel-surface-pr181*'` once the test is done.

# linux-surface's patches and Fedora packaging, pinned to a full commit hash: linux-surface's own release
# fedora-43-7.2.12-1 (tag in linux-surface/linux-surface), with none of our Pro 9 fixes.
CONTRIB_URL="https://github.com/linux-surface/linux-surface"
CONTRIB_COMMIT="38360dbfdc5bcfd76d454fc1bee3d91fb89d5fb5"

# Fedora's kernel tree (kernel-ark), and the tag the package is built from: kernel-X.Y.Z-0.
ARK_URL="https://gitlab.com/cki-project/kernel-ark"
PACKAGE_TAG="kernel-7.2.12-0"
# ...and the full commit hash that tag must point to (a moved tag stops the build).
ARK_COMMIT="c18232b4fa0f9f3679a53c94f2d127d1f23b5c75"

# The package's release number (bump it to rebuild the same kernel; back to 1, and drop the note after
# it, for a new point release).
PACKAGE_RELEASE="1"

# The test package's own name (kernel-surface-pr181) and release suffix (.pr181), so this kernel never
# looks like, or replaces, linux-surface's kernel-surface or this repository's kernel-surface-cmdrshepardspie
# (or the kernel-surface-samtest test) packages: `uname -r` is 7.2.12-1.pr181.fc43.x86_64.
# fixups/0003 removes the packaging lines that would act on linux-surface's package, and build-srpm.sh refuses any that remain.
PACKAGE_NAME="surface-pr181"
RELEASE_SUFFIX=".pr181"

# Fedora packaging patches (pkg/fedora/kernel-surface/patches and secureboot/) from this commit
# instead of CONTRIB's, when CONTRIB's don't fit this kernel's spec. Empty: use CONTRIB's.
# 7.2.12: linux-surface's own (updated for 7.2 in 8ce82366) apply to kernel-7.2.12-0's spec.
PKG_PATCHES_URL=""
PKG_PATCHES_COMMIT=""
