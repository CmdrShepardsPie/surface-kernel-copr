# pins.conf: what build-srpm.sh builds. Change these to move to a new point release (see README.md).
# Sourced by bash: plain NAME="value" lines only.

# linux-surface's patches and Fedora packaging: a fork branch, pinned to a full commit hash.
CONTRIB_URL="https://github.com/CmdrShepardsPie/linux-surface-contrib"
CONTRIB_COMMIT="86cc5d918e901f8e755dc94df247070cad3e5a7d"

# Fedora's kernel tree (kernel-ark), and the tag the package is built from: kernel-X.Y.Z-0.
ARK_URL="https://gitlab.com/cki-project/kernel-ark"
PACKAGE_TAG="kernel-6.18.56-0"

# The package's release number (bump it to rebuild the same kernel).
PACKAGE_RELEASE="1"

# Fedora packaging patches (pkg/fedora/kernel-surface/patches and secureboot/) from this commit of
# linux-surface/linux-surface instead of the fork's, when the fork's don't fit this kernel's spec.
# Empty: use the fork's. (6.18: the ones from "Update Fedora kernels to v6.18.8".)
PKG_PATCHES_URL="https://github.com/linux-surface/linux-surface"
PKG_PATCHES_COMMIT="581fbdd6134d8cc8a03011c1cea8f704359fde6a"
