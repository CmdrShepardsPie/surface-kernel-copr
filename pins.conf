# pins.conf: what build-srpm.sh builds. Change these to move to a new point release (see README.md).
# Sourced by bash: plain NAME="value" lines only.
#
# TEST BRANCH test/7.2.12-sam, never merged: a boot test of the SAM probe-deferral fix on the Surface Pro 9.
# Two builds, from two commits of this branch, under their own package name (kernel-surface-samtest) so
# they never touch kernel-surface-cmdrshepardspie or linux-surface's kernel-surface:
#   .sam0  the control: linux-surface's official release fedora-43-7.2.12-1, with no patches of ours;
#   .sam1  the same plus only fixups/0005 (the SAM fix).
# Remove both with `dnf remove 'kernel-surface-samtest*'` once the test is done.

# linux-surface's patches and Fedora packaging, pinned to a full commit hash: linux-surface's own release
# fedora-43-7.2.12-1 (tag in linux-surface/linux-surface; fetched here from linux-surface-contrib, a fork in
# the same network, which serves it by hash), with none of our Pro 9 fixes.
CONTRIB_URL="https://github.com/CmdrShepardsPie/linux-surface-contrib"
CONTRIB_COMMIT="38360dbfdc5bcfd76d454fc1bee3d91fb89d5fb5"

# Fedora's kernel tree (kernel-ark), and the tag the package is built from: kernel-X.Y.Z-0.
ARK_URL="https://gitlab.com/cki-project/kernel-ark"
PACKAGE_TAG="kernel-7.2.12-0"
# ...and the full commit hash that tag must point to (a moved tag stops the build).
ARK_COMMIT="c18232b4fa0f9f3679a53c94f2d127d1f23b5c75"

# The package's release number (bump it to rebuild the same kernel; back to 1, and drop the note after
# it, for a new point release).
PACKAGE_RELEASE="1"

# The test package's own name (kernel-surface-samtest) and release suffix (.sam0 control, .sam1 with the
# fix), so these kernels never look like, or replace, linux-surface's kernel-surface or this repository's
# kernel-surface-cmdrshepardspie packages: `uname -r` is 7.2.12-1.sam0.fc43.x86_64 / 7.2.12-1.sam1.fc43.x86_64.
# fixups/0003 removes the packaging lines that would act on linux-surface's package, and build-srpm.sh refuses any that remain.
PACKAGE_NAME="surface-samtest"
RELEASE_SUFFIX=".sam0"

# Fedora packaging patches (pkg/fedora/kernel-surface/patches and secureboot/) from this commit
# instead of CONTRIB's, when CONTRIB's don't fit this kernel's spec. Empty: use CONTRIB's.
# 7.2.12: linux-surface's own (updated for 7.2 in 8ce82366) apply to kernel-7.2.12-0's spec.
PKG_PATCHES_URL=""
PKG_PATCHES_COMMIT=""
